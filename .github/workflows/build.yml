# Save at .github/workflows/build.yml in your GitHub repository.
# Supports MLLab.xcodeproj at the repository root or inside MLLab/.
# Default: build an UNSIGNED device IPA, requiring no Apple credentials.
# To install it, sign it separately or use a signed manual run below.
#
# Optional signed runs require these repository Actions secrets:
#   BUILD_CERTIFICATE_BASE64       Base64 .p12 certificate INCLUDING private key
#   P12_PASSWORD                   Password for that .p12 (may be empty)
#   BUILD_PROVISION_PROFILE_BASE64 Base64 .mobileprovision for registered devices
# Use a development certificate/profile for "development", or an Apple
# Distribution certificate/ad hoc profile for "ad-hoc". Explicit App ID only.
# The bundle ID and team are taken from the profile; no Apple login is used.

name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      signing:
        description: IPA signing mode (unsigned needs no secrets)
        required: true
        default: unsigned
        type: choice
        options: [unsigned, development, ad-hoc]

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Standard GitHub-hosted ARM64 macOS VM with Xcode 27 / iOS 27 SDK.
    # This image is currently in public preview. No larger runner is used.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SCHEME: MLLab
      CONFIGURATION: Release
      BUILD_MODE: ${{ inputs.signing || 'unsigned' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check Xcode, SDK, and project
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [[ "${sdk_version%%.*}" -lt 27 ]]; then
            echo "::error::An iOS 27 or newer SDK is required. Installed: $sdk_version"
            exit 1
          fi

          if [[ -f MLLab.xcodeproj/project.pbxproj ]]; then
            project="$GITHUB_WORKSPACE/MLLab.xcodeproj"
          elif [[ -f MLLab/MLLab.xcodeproj/project.pbxproj ]]; then
            project="$GITHUB_WORKSPACE/MLLab/MLLab.xcodeproj"
          else
            echo "::error::Unzip and commit the project source. MLLab.xcodeproj was not found."
            exit 1
          fi

          case "$BUILD_MODE" in
            unsigned|development|ad-hoc) ;;
            *) echo "::error::Unknown signing mode"; exit 1 ;;
          esac
          {
            echo "PROJECT_FILE=$project"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/MLLab.xcarchive"
            echo "OUTPUT_DIR=$RUNNER_TEMP/ipa-output"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/MLLab-signing.keychain-db"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ipa-output"
          xcodebuild -list -project "$project"

      - name: Install signing certificate and provisioning profile
        if: env.BUILD_MODE != 'unsigned'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for secret, filename in [
              ('BUILD_CERTIFICATE_BASE64', 'certificate.p12'),
              ('BUILD_PROVISION_PROFILE_BASE64', 'profile.mobileprovision'),
          ]:
              value = os.environ.get(secret, '')
              if not value:
                  raise SystemExit(f'::error::Missing Actions secret: {secret}')
              payload = base64.b64decode(''.join(value.split()), validate=True)
              if not payload:
                  raise SystemExit(f'::error::Empty Actions secret: {secret}')
              (Path(os.environ['RUNNER_TEMP']) / filename).write_bytes(payload)
          PY

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          python3 - <<'PY'
          import datetime, hashlib, os, plistlib, re, shutil, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((temp / 'profile.plist').read_bytes())
          entitlements = profile['Entitlements']
          uuid = profile['UUID']
          team = profile['TeamIdentifier'][0]
          app_id = entitlements['application-identifier']
          bundle_id = app_id.split('.', 1)[1]
          if '*' in bundle_id:
              raise SystemExit('::error::Use an explicit App ID profile, not a wildcard.')
          if not re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+', bundle_id):
              raise SystemExit('::error::Invalid bundle identifier in profile.')
          if not re.fullmatch(r'[A-Za-z0-9-]+', uuid + team):
              raise SystemExit('::error::Invalid profile UUID or team.')
          expiry = profile['ExpirationDate'].replace(tzinfo=datetime.timezone.utc)
          if expiry <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit('::error::Provisioning profile has expired.')
          if profile.get('ProvisionsAllDevices') or not profile.get('ProvisionedDevices'):
              raise SystemExit('::error::Use a development or ad hoc profile with registered devices.')
          mode = os.environ['BUILD_MODE']
          development = bool(entitlements.get('get-task-allow', False))
          if development != (mode == 'development'):
              raise SystemExit('::error::The selected signing mode does not match the profile type.')
          identities = subprocess.check_output([
              'security', 'find-identity', '-v', '-p', 'codesigning',
              os.environ['KEYCHAIN_PATH'],
          ], text=True)
          installed = set(re.findall(r'\b[0-9A-F]{40}\b', identities))
          allowed = {hashlib.sha1(cert).hexdigest().upper()
                     for cert in profile['DeveloperCertificates']}
          matching = sorted(installed & allowed)
          if not matching:
              raise SystemExit('::error::Imported signing identity does not match the profile.')
          identity = matching[0]
          for directory in [
              Path.home() / 'Library/MobileDevice/Provisioning Profiles',
              Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles',
          ]:
              directory.mkdir(parents=True, exist_ok=True)
              shutil.copy2(temp / 'profile.mobileprovision', directory / f'{uuid}.mobileprovision')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in [('PROFILE_UUID', uuid), ('TEAM_ID', team),
                                 ('BUNDLE_ID', bundle_id), ('SIGNING_IDENTITY', identity)]:
                  output.write(f'{key}={value}\n')
          options = {
              'method': 'debugging' if development else 'release-testing',
              'destination': 'export',
              'teamID': team,
              'signingStyle': 'manual',
              'signingCertificate': identity,
              'provisioningProfiles': {bundle_id: uuid},
              'manageAppVersionAndBuildNumber': False,
          }
          (temp / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.plist"

      - name: Archive for a physical iPhone
        run: |
          set -euo pipefail
          if [[ "$BUILD_MODE" == unsigned ]]; then
            signing=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=)
          else
            signing=(
              CODE_SIGNING_ALLOWED=YES
              CODE_SIGN_STYLE=Manual
              "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY"
              "DEVELOPMENT_TEAM=$TEAM_ID"
              "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"
              "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID"
            )
          fi
          xcodebuild archive \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 2 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO SKIP_INSTALL=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" \
            "${signing[@]}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Package unsigned IPA
        if: env.BUILD_MODE == 'unsigned'
        run: |
          set -euo pipefail
          app="$ARCHIVE_PATH/Products/Applications/MLLab.app"
          if [[ ! -d "$app" ]]; then
            echo "::error::Archive did not contain MLLab.app. Check the scheme and product name."
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun lipo -verify_arch arm64 "$app/$executable"
          mkdir -p "$RUNNER_TEMP/ipa-staging/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa-staging/Payload/MLLab.app"
          # Payload must be at the root of the IPA; no simulator app is used.
          ditto -c -k --keepParent --norsrc \
            "$RUNNER_TEMP/ipa-staging/Payload" "$OUTPUT_DIR/MLLab-unsigned.ipa"

      - name: Export signed IPA
        if: env.BUILD_MODE != 'unsigned'
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$RUNNER_TEMP/signed-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          ipas=("$RUNNER_TEMP/signed-export/"*.ipa)
          if [[ ${#ipas[@]} -ne 1 || ! -f "${ipas[0]}" ]]; then
            echo "::error::Expected exactly one exported IPA."
            exit 1
          fi
          cp "${ipas[0]}" "$OUTPUT_DIR/MLLab-$BUILD_MODE.ipa"

      - name: Verify IPA layout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, zipfile
          from pathlib import Path
          files = list(Path(os.environ['OUTPUT_DIR']).glob('*.ipa'))
          if len(files) != 1:
              raise SystemExit('Expected exactly one IPA artifact.')
          with zipfile.ZipFile(files[0]) as ipa:
              if ipa.testzip() is not None:
                  raise SystemExit('IPA ZIP integrity check failed.')
              info = plistlib.loads(ipa.read('Payload/MLLab.app/Info.plist'))
              executable = 'Payload/MLLab.app/' + info['CFBundleExecutable']
              if executable not in ipa.namelist() or info.get('CFBundleSupportedPlatforms') != ['iPhoneOS']:
                  raise SystemExit('IPA must contain a physical-device iOS application.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Built **{files[0].name}** with the iOS device SDK.\n\n")
              if os.environ['BUILD_MODE'] == 'unsigned':
                  summary.write('Unsigned IPA: sign it before installing on an iPhone.\n')
              else:
                  summary.write('Signed IPA: install only on devices authorized by the provisioning profile.\n')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MLLab-IPA-${{ env.BUILD_MODE }}-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/*.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: MLLab-build-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always() && env.BUILD_MODE != 'unsigned'
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/MLLab-signing.keychain-db" || true
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
